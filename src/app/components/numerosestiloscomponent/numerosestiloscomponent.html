<h1>Numeros</h1>
<h2>Base</h2>
<ul>
  @for (e of num; track e) {
    <li>{{ e }}</li>
  }
</ul>

<h2>Tipo 1</h2>
<ul>
  @for (e of num; track e) {
    <li [class.par]="e % 2 == 0" [class.impar]="e % 2 == 1">{{ e }}</li>
  }
</ul>

<h2>Tipo 2</h2>
<ul>
  @for (e of num; track e) {
    <li
      [ngClass]="{
        par: e % 2 == 0,
        impar: e % 2 == 1,
      }"
    >
      {{ e }}
    </li>
  }
</ul>

<h2>Tipo 3</h2>
<ul>
  @for (e of num; track e) {
    @if (e % 2 == 0) {
      <li style="color: red">{{ e }}</li>
    } @else {
      <li style="color: green">{{ e }}</li>
    }
  }
</ul>
